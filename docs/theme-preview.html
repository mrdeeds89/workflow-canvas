<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workflow Canvas — theme proposal</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:14px system-ui,sans-serif;background:#e5e7eb;color:#1f2937}h1{font-size:20px;margin:0 0 8px}body>p{margin:0 0 18px}.samples{display:grid;gap:20px}.sample{--canvas:#f4f6f8;--surface:#fff;--sidebar:#eef1f5;--border:#d9dee5;--text:#1f2937;--muted:#626b79;--accent:#4f46e5;--button:#4f46e5;--on-button:#fff;--agent:#eef2ff;--human:#fff7ed;--warn:#fef3c7;--warn-text:#78350f;--good:#dcfce7;--good-text:#166534;--edge:#475569;--dot:#ccd2dc;--neutral:#f3f4f6;color:var(--text);background:var(--canvas);border:1px solid var(--border);border-radius:10px;overflow:hidden}.dark{--canvas:#151a23;--surface:#202733;--sidebar:#191f2a;--border:#455164;--text:#e7edf5;--muted:#b0bbcb;--accent:#a5a0ff;--button:#6258d9;--agent:#2b2d4b;--human:#3b3028;--warn:#43351c;--warn-text:#f6d58a;--good:#203c2e;--good-text:#9be0b3;--edge:#b0bed1;--dot:#3b4658;--neutral:#303947;color-scheme:dark}.bar{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}.bar strong{flex:1}.bar label{font-size:12px;color:var(--muted)}select,input,button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 9px}button{cursor:pointer}button.primary{background:var(--button);color:var(--on-button);border-color:var(--button)}:focus-visible,.focus-example{outline:2px solid var(--accent);outline-offset:3px}.layout{display:grid;grid-template-columns:180px 1fr 230px;min-height:300px}.side{padding:14px;background:var(--sidebar);border-right:1px solid var(--border)}.side button{width:100%;text-align:left}.sub{color:var(--muted);font-size:12px;margin:18px 0 8px}.active{background:var(--surface);padding:9px;border-radius:6px;font-weight:600}.menu{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px}.menu button{display:block;border:0;width:100%;text-align:left;padding:5px}.canvas{padding:26px 24px;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:24px 24px;display:flex;align-items:center;justify-content:center;gap:12px}.card{width:268px;flex-shrink:0;padding:12px;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:10px;outline:2px solid var(--accent);outline-offset:2px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px}.kind{color:var(--accent);font-weight:700}.pill{padding:3px 7px;border-radius:999px;font-size:11px;background:var(--neutral);border:1px dashed var(--muted)}.card h2{font-size:14px;margin:7px 0}.muted{color:var(--muted);font-size:12px;line-height:1.45}.owners{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}.owners div{padding:8px;background:var(--agent);border-radius:6px;font-size:12px}.owners div:last-child{background:var(--human)}.owners b{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.edge{width:90px;flex-shrink:0;text-align:center;color:var(--edge);font-size:12px}.edge svg{width:90px;height:24px}.detail{background:var(--surface);border-left:1px solid var(--border);padding:14px}.detail label{display:block;font-size:12px;color:var(--muted);margin:12px 0}.detail input{display:block;width:100%;margin-top:6px}.warning{padding:9px;background:var(--warn);color:var(--warn-text);border-radius:6px;font-size:12px;line-height:1.4;margin:12px 0}.good{display:inline-block;background:var(--good);color:var(--good-text);padding:4px 8px;border-radius:12px;font-size:11px}.footer{padding:9px 16px;border-top:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px}@media(max-width:900px){.layout{grid-template-columns:150px 1fr}.detail{grid-column:1/-1}.canvas{padding:20px 12px}.edge{width:65px}.edge svg{width:65px}}
</style></head><body><h1>Theme proposal — same editor, two palettes</h1><p>Static visual sample, not the application. Light stays the default. Follow system will use either palette; the explicit choice will be saved in this browser.</p><div class="samples" id="samples"></div><template id="sample"><section class="sample"><header class="bar"><strong></strong><span class="muted">Design only</span><label>Theme <select aria-label="Theme preview"><option>Light</option><option>Dark</option><option>Follow system</option></select></label></header><div class="layout"><aside class="side"><button class="primary">+ New workflow</button><div class="sub">PROJECTS / RESEARCH</div><div class="active">Research workflow ⋯</div><div class="menu"><button>Rename</button><button>Duplicate</button><button>Move to…</button></div></aside><main class="canvas"><article class="card"><div class="head"><span class="kind">AGENT</span><span class="pill">Proposed</span></div><h2>Review source evidence</h2><div class="muted">Check sources before preparing a summary.</div><div class="owners"><div><b>AGENT OWNS</b>Gather evidence</div><div><b>YOU OWN</b>Review findings</div></div><div class="muted">Setup &nbsp; ✓ 1 / 2 complete</div></article><div class="edge">requires<svg viewBox="0 0 90 24" aria-label="Dependency arrow"><path d="M0 12H85M77 6L85 12L77 18" fill="none" stroke="currentColor" stroke-width="2"/></svg></div></main><aside class="detail"><b>Card details</b><label>Name<input value="Review source evidence" class="focus-example"></label><div class="muted">Focus ring shown for review.</div><div class="warning"><b>Warning:</b> Configuration is not proof of a successful run.</div><span class="good">Configured</span><p class="muted">Status retains written labels, check marks and progress counts.</p></aside></div><footer class="footer">Selected card has an outline · Arrows retain labels and line patterns · Nothing on this canvas runs.</footer></section></template><script>
const template=document.querySelector('#sample');for(const theme of ['Light','Dark']){const node=template.content.cloneNode(true);const section=node.querySelector('.sample');section.classList.toggle('dark',theme==='Dark');node.querySelector('strong').textContent=theme+' — Workflow Canvas';const select=node.querySelector('select');select.value=theme;select.addEventListener('change',()=>{section.classList.toggle('dark',select.value==='Dark'||select.value==='Follow system'&&matchMedia('(prefers-color-scheme: dark)').matches)});document.querySelector('#samples').append(node)}
</script></body></html>
